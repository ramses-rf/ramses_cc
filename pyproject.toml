#
### project ##########################################################################
#
[project]
  name = "ramses_cc"
  description = "Home Assistant custom integration for a stateful RAMSES-II protocol decoder & analyser."
  readme = "README.md"
  authors = [
    {name = "Egbert Broerse", email = "dcc2@ebroerse.nl"}  # and many others
  ]
  maintainers = [
    {name = "Egbert Broerse", email = "dcc2@ebroerse.nl"}
  ]
  license = "MIT"
  license-files = ["LICENSE*"]

  classifiers = [
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.14",
  ]
  requires-python = ">=3.14.2"        # HA core >=3.14.2

#
[project.urls]
  "Homepage" = "https://github.com/ramses-rf/ramses_cc"
  "Bug Tracker" = "https://github.com/ramses-rf/ramses_cc/issues"
  "Wiki" = "https://github.com/ramses-rf/ramses_rf/wiki"
  "Contributing" = "https://github.com/ramses-rf/ramses_cc/blob/master/CONTRIBUTING.md"
#
### pytest ###########################################################################

[tool.pytest.ini_options]
  asyncio_default_fixture_loop_scope = "function"
  asyncio_mode = "auto"

  testpaths = [
    "tests/"
  ]

  # Kill hanging tests after 60 seconds
  # Without this, a hung test runs for 6 hours until GitHub Actions
  # kills the job.
  timeout = 60
  # Continue collecting/running other tests after a timeout, don't abort
  # the entire session.
  timeout_method = "thread"

  # pytest-cov slows down our tests on GitHub Actions to 10 mins, so use coverage.py instead.
  # PyCharm might not hit a breakpoint. For debugging, disable -cov by adding:
  # –no-cov"

#
### coverage #########################################################################
# We run coverage in a separate check-cov workflow on python 3.14 only (fastest)
# to run coverage.py locally, enter these 2 commands in 2 steps:
# coverage run -m pytest
# coverage report
# or
# coverage html
# open coverage_html/index.html in a browser for details

[tool.coverage.run]
core = "sysmon"  # essential setting for speed on GitHub < 11 secs instead of >12 mins
branch = false  # true takes a lot longer and can't be combined with sysmon
#  patch = ["subprocess"]
source = [
    "custom_components/ramses_cc",
    "tests"
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
]
format = "text"
fail_under = 94
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html"

#
### mypy ############################################################################

[tool.mypy]
  files = [
    "custom_components",
    "tests"
  ]
  explicit_package_bases = true

  follow_imports = "skip"  # TODO: don't use this feature

  # see: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options

  # Start off with these
  warn_unused_configs = true
  warn_redundant_casts = true  # this is not per-module
  warn_unused_ignores = true

  # Getting these passing should be easy
  extra_checks = true  # now incl.: strict_concatenate = true
  strict_equality = true

  # Strongly recommend enabling this one as soon as you can
  check_untyped_defs = true

  # These shouldn't be too much additional work, but may be tricky to
  # get passing if you use a lot of untyped libraries
  # disallow_subclassing_any = true                                                    # excl. for HA
  # disallow_untyped_decorators = true                                                 # excl. for HA
  disallow_any_generics = true

  # These next few are various gradations of forcing use of type annotations
  disallow_untyped_calls = true
  disallow_incomplete_defs = true
  disallow_untyped_defs = true

  # This one isn't too hard to get passing, but return on investment is lower
  no_implicit_reexport = true
  no_implicit_optional = true

  # This one can be tricky to get passing if you use a lot of untyped libraries
  # warn_return_any = true                                                             # excl. for HA: lots of decorators

  # disallow_any_unimported = true
  warn_no_return = true
  warn_unreachable = true


[[tool.mypy.overrides]]
  module = [
    "homeassistant.*",
    "ramses_rf.*",
    "yaml.*",
  ]
  ignore_missing_imports = true


[[tool.mypy.overrides]]
  module = "tests.*"
  no_implicit_reexport = false
  warn_unused_ignores = false
  disable_error_code = [
    "attr-defined",   # Dynamic mocks and module re-exports in tests
    "method-assign",  # Assigning MagicMock to methods in tests
    "assignment",     # Assigning MagicMock to None-typed fields
    "unreachable",    # Assert narrowing on mutable properties and pytest.raises
    "union-attr",     # Accessing attrs on Mock await_args (_Call | None)
    "no-untyped-def", # Test helper functions without full type annotations
    "var-annotated",  # Unannotated empty dictionaries/lists in test bodies
    "arg-type",       # Intentional invalid inputs tested via pytest.raises
    "type-arg",       # Missing generic parameters on containers in tests
    "misc",           # Variadic argument unpacking in test tables
    "valid-type",     # Module-level variable type alias references
    "func-returns-value",
    "comparison-overlap",
    "operator",
  ]


#
## ruff ##############################################################################

[tool.ruff]
  line-length = 79
  src = ["custom_components", "tests"]
  target-version = "py313"  # to prevent except Err1, Err2: without () to pass


[tool.ruff.lint]
  select = [
    "ASYNC",   # flake8-async
    "B",       # flake8-bugbear
    "D",       # pydocstyle
    "E",       # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "Q",       # flake8-quotes
    "SIM",     # flake8-simplify
    "TID251",  # flake8-tidy-imports (banned-api)
    "UP",      # pyupgrade
  ]
  ignore = [
    "ASYNC109",
    "ASYNC110",
    "B011",
    "D203",
    "D213",
    "E501",
    "SIM102",
    "SIM114",
    "UP040",
  ]

  # ASYNC109 - Async function with a timeout parameter
  # ASYNC110 - Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
  # B011     - Do not call assert False since python -O removes these calls
  # D203     - 1 blank line required before class docstring (conflicts with D211)
  # D213     - Multi-line docstring summary should start at the second line (conflicts with D212)
  # E501     - Line too long
  # SIM102   - Use a single `if` statement instead of nested `if` statements
  # SIM114   - Combine `if` branches using logical `or` operator
  # UP040    - Type alias uses `TypeAlias` annotation instead of the `type` keyword


[tool.ruff.lint.flake8-import-conventions.extend-aliases]
  voluptuous = "vol"
  probatio = "prob"
  "homeassistant.helpers.area_registry" = "ar"
  "homeassistant.helpers.config_validation" = "cv"
  "homeassistant.helpers.device_registry" = "dr"
  "homeassistant.helpers.entity_registry" = "er"
  "homeassistant.helpers.issue_registry" = "ir"
  "homeassistant.util.dt" = "dt_util"

[tool.ruff.lint.flake8-pytest-style]
  fixture-parentheses = false

[tool.ruff.lint.flake8-quotes]
  inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
  "async_timeout".msg = "use asyncio.timeout instead"
  "pytz".msg = "use zoneinfo instead"

[tool.ruff.lint.isort]
  combine-as-imports = true
  force-sort-within-sections = false
  known-first-party = ["custom_components", "ramses_rf", "ramses_tx"]
  split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
  "tests/*" = ["ASYNC", "D"]

## pyright(VSCODE) ###########################################################

[tool.pyright]
reportIncompatibleVariableOverride = "none"
reportIncompatibleMethodOverride = "none"
